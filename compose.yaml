name: repeat-order

# Shared build definition so the "app" and "web" images always compile the
# frontend with identical Vite environment values. Different VITE_* values in
# the two images would produce different hashed asset filenames.
x-build: &default-build
  context: .
  args:
    VITE_APP_NAME: ${APP_NAME:-Laravel}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:-repeat-order-app:local}
    build:
      <<: *default-build
      target: app
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: production
      # Required at runtime. The entrypoint refuses to start without it, but
      # leaving it empty here allows `docker compose build` in CI without
      # exposing production secrets to the build step.
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://127.0.0.1:8000}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
      APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}

      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}

      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_STACK: ${LOG_STACK:-single}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
      LOG_LEVEL: ${LOG_LEVEL:-warning}

      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/laravel/database.sqlite
      DB_FOREIGN_KEYS: "true"

      SESSION_DRIVER: database
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}

      CACHE_STORE: database
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-null}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Laravel}

      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      # SQLite database lives outside the source tree and survives recreates.
      - sqlite_data:/var/lib/laravel
      # User uploads and the repository's seed images.
      - storage_public:/var/www/html/storage/app/public
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 30s
    logging: *default-logging

  web:
    image: ${WEB_IMAGE:-repeat-order-web:local}
    build:
      <<: *default-build
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Caddy on the host proxies to this localhost-only port.
      - "127.0.0.1:8000:80"
    volumes:
      # Shared upload volume, mounted read-only for Nginx.
      - storage_public:/var/www/html/public/storage:ro
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

volumes:
  sqlite_data:
  storage_public:

networks:
  laravel:
    driver: bridge
