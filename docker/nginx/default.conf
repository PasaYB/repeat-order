# Caddy on the host terminates TLS and forwards X-Forwarded-Proto.
# Tell PHP that the original request was HTTPS so Laravel generates secure
# URLs and redirects correctly.
map $http_x_forwarded_proto $laravel_https {
    default "";
    ~*^https$ on;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    client_max_body_size 25m;
    client_body_timeout 60s;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caddy on the host is the reverse proxy. Trust the Docker bridge/loopback
    # source addresses so $remote_addr (and therefore Laravel's client IP and
    # auth throttling) reflects the real client from X-Forwarded-For.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's embedded DNS. Re-resolve the app container so Nginx recovers
    # when the PHP-FPM container is recreated with a new IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $php_fpm app:9000;

    # Never expose dotfiles (for example .env or .git). This is checked before
    # the PHP/static regex locations below.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Immutable Vite build output (hashed filenames).
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded files from the persistent storage volume.
    location ^~ /storage/ {
        # Never serve executable source from the upload volume.
        if ($uri ~* "\.(php|phtml|phar)$") {
            return 404;
        }

        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Do not serve dotfiles that may exist in the upload volume.
    location ^~ /storage/. {
        deny all;
    }

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass $php_fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $laravel_https;
        fastcgi_param HTTP_PROXY "";

        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }
}
